name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the build to TestFlight after a successful build"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pin to the /Applications/Xcode.app symlink (GitHub's runner images always keep this
      # pointing at the current default/latest stable Xcode with matching simulator runtimes
      # preinstalled) rather than a specific "Xcode_16.app" version string — a hardcoded version
      # broke CI once already when the runner image's available versions/runtimes drifted out of
      # sync with a pinned SDK (see git history: "No simulator runtime version ... available to
      # use with iphonesimulator SDK version"). Logging the version + runtimes here makes the next
      # such mismatch immediately diagnosable from the Actions log instead of a bare BUILD FAILED.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, simulator — no signing needed)
        run: |
          xcodebuild build \
            -project AuraLink.xcodeproj \
            -scheme AuraLink \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      # Select an available iPhone simulator by UDID rather than a hardcoded device name
      # ("iPhone 16") — device names come and go across Xcode/simulator releases, and picking
      # whatever is actually installed on the runner is more durable than guessing one.
      - name: Select a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE '[0-9A-F-]{36}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project AuraLink.xcodeproj \
            -scheme AuraLink \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  release-testflight:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_testflight == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen and fastlane
        run: |
          brew install xcodegen
          gem install bundler
          bundle install --gemfile=fastlane/Gemfile || gem install fastlane

      - name: Generate Xcode project
        run: xcodegen generate

      # Requires these repo secrets (see docs/02-IOS-ARCHITECTURE-PLAN.md → CI/CD section):
      #   ASC_KEY_ID       — App Store Connect API key ID
      #   ASC_ISSUER_ID    — App Store Connect API issuer ID
      #   ASC_KEY_P8       — the .p8 private key file, base64-encoded
      #   MATCH_PASSWORD   — only needed if you later switch to fastlane match for cert management
      - name: Build, sign, and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane beta
